spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update   # trocar para "validate" quando o schema do Enzo estiver pronto
    show-sql: false
  h2:
    console:
      enabled: false